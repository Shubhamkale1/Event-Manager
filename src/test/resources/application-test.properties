# Disable Elasticsearch for CI tests
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.elasticsearch.ReactiveElasticsearchRepositoriesAutoConfiguration

# Use test database
spring.datasource.url=jdbc:mysql://localhost:3306/eventdb_test?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=testpassword

# Disable JPA show SQL in tests
spring.jpa.show-sql=false

# JWT for tests
app.jwt.secret=test-secret-key-for-ci-minimum-32-chars-here
app.jwt.expiration=86400000

# Disable email in tests
spring.mail.host=localhost
spring.mail.port=25
spring.mail.properties.mail.smtp.auth=false

# Disable AI in tests
spring.ai.openai.api-key=test-key-not-used-in-tests