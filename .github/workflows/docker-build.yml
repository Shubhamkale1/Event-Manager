name: CD — Build and Push Docker Image

# ── Only runs on push to main ─────────────────────
# Feature branches only run tests
# Only main branch produces Docker images
on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Manual trigger from GitHub UI
  # Useful for forcing a rebuild

jobs:

  # ── Job 1: Tests must pass first ─────────────────
  test:
    name: Verify Tests Pass
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: eventdb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost
          -u root -ptestpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        run: mvn clean test -q
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/eventdb_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: testpassword
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
          APP_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_JWT_EXPIRATION: 86400000
          SPRING_MAIL_HOST: sandbox.smtp.mailtrap.io
          SPRING_MAIL_PORT: 2525
          SPRING_MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          APP_GEOCODING_API_KEY: ${{ secrets.GEOCODING_API_KEY }}
          SPRING_AI_OPENAI_API_KEY: ${{ secrets.AI_API_KEY }}
          SPRING_AI_OPENAI_BASE_URL: https://api.groq.com/openai
          SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL: llama3-8b-8192

  # ── Job 2: Build Docker image ─────────────────────
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    # THIS IS THE KEY LINE
    # needs: test means:
    # Job 2 only starts if Job 1 (test) succeeds
    # If tests fail → no Docker image is built
    # Broken code never gets a deployable image

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # Buildx is enhanced Docker build tool
        # Supports multi-platform builds
        # Better layer caching support

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        # Authenticates to Docker Hub
        # Required before pushing images

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/event-manager
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
        # This generates tags automatically:
        # shubhamkale1/event-manager:latest
        # shubhamkale1/event-manager:sha-abc1234
        # shubhamkale1/event-manager:main
        #
        # sha tag is important for rollback
        # If latest breaks, deploy sha-abc1234 (previous version)

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # cache-from/to: uses GitHub Actions cache
          # for Docker layer caching
          # Same concept as Maven caching
          # If base image and dependencies did not change
          # those layers are reused from cache
          # Reduces build time from 8 minutes to 2 minutes

      - name: Deployment summary
        run: |
          echo "## Deployment Ready" >> $GITHUB_STEP_SUMMARY
          echo "Image: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "To deploy: docker pull ${{ secrets.DOCKER_USERNAME }}/event-manager:latest" >> $GITHUB_STEP_SUMMARY